---
- name: audit | Gather PAM state
  ansible.builtin.include_tasks: facts.yml

- name: audit | Look at faillock.conf
  ansible.builtin.stat:
    path: "{{ linux_hardening_pam_faillock_conf }}"
  register: __lh_pam_conf

- name: audit | Read faillock.conf
  ansible.builtin.slurp:
    src: "{{ linux_hardening_pam_faillock_conf }}"
  register: __lh_pam_conf_content
  when: __lh_pam_conf.stat.exists

- name: audit | Compare faillock.conf with the desired content
  ansible.builtin.set_fact:
    __lh_pam_conf_ok: >-
      {{ __lh_pam_conf.stat.exists
         and (__lh_pam_conf_content.content | b64decode) == lookup('ansible.builtin.template', 'faillock.conf.j2')
         and __lh_pam_conf.stat.mode == '0644' }}

# On EL a missing profile can only be fixed when the user named one to select.
- name: audit | Can the PAM stack be fixed by this role?
  ansible.builtin.set_fact:
    __lh_pam_can_fix: >-
      {{ ansible_facts['os_family'] == 'Debian'
         or (__lh_pam_profile | default('')) != ''
         or linux_hardening_pam_authselect_profile is not none }}

- name: audit | Record findings
  ansible.builtin.set_fact:
    linux_hardening_pam_findings: >-
      {{ ([] if __lh_pam_stack_ok else [{
            'key': 'PAM stack calls pam_faillock',
            'expected': 'enabled',
            'actual': 'not enabled' ~ ('' if __lh_pam_can_fix else ' (no authselect profile selected; set linux_hardening_pam_authselect_profile)'),
            'fixable': __lh_pam_can_fix}])
         + ([] if __lh_pam_conf_ok else [{
            'key': 'file ' ~ linux_hardening_pam_faillock_conf,
            'expected': 'present with the desired settings',
            'actual': 'missing or different',
            'fixable': true}]) }}

- name: audit | Report pam_hardening result
  ansible.builtin.debug:
    msg: "{{ 'COMPLIANT' if linux_hardening_pam_findings | length == 0 else linux_hardening_pam_findings }}"

# Before remediation (and when fail_on_error is set) every finding fails the run.
# After remediation only findings the role could have fixed do.
- name: audit | Fail on findings
  ansible.builtin.fail:
    msg: "pam_hardening found {{ __lh_pam_blocking | length }} deviation(s)."
  vars:
    __lh_pam_blocking: >-
      {{ linux_hardening_pam_findings | selectattr('fixable') | list
         if __lh_pam_audit_fatal | default(false)
         else linux_hardening_pam_findings }}
  when:
    - (__lh_pam_audit_fatal | default(false)) or (linux_hardening_fail_on_error | bool)
    - __lh_pam_blocking | length > 0
