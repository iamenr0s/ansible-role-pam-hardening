---

dependencies: []

galaxy_info:
  role_name: pam_hardening
  author: iamenr0s
  description: "Manages PAM account lockout (pam_faillock) via authselect or pam-auth-update on Debian/Ubuntu and RHEL-family (AlmaLinux, Rocky, Fedora) hosts. Audits by default and changes the PAM stack only when remediation is confirmed."
  license: MIT
  min_ansible_version: "2.16"
  platforms:
    - name: "EL"
      versions:
        - "8"
        - "9"
        - "10"
    - name: "Fedora"
      versions:
        - "42"
        - "43"
        - "44"
    - name: "Debian"
      versions:
        - "bookworm"
        - "trixie"
    - name: "Ubuntu"
      versions:
        - "jammy"
        - "noble"
  galaxy_tags:
    - security
    - pam
    - faillock
    - authentication
    - hardening
    - compliance
