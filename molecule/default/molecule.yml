---
# Platforms and provisioner come from .config/molecule/config.yml
scenario:
  # Molecule's default sequence plus check: a dry-run remediate must not fail.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
